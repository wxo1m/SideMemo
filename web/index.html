<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SideMemo 웹</title>
<link rel="icon" href="app.ico">
<style>
  :root {
    --bg: #f3f3f4; --panel: #ffffff; --text: #242a38; --muted: #74747a;
    --line: #dedee4; --accent: #9250bc; --accent-soft: #ede2f8;
  }
  body.dark {
    --bg: #1e1e24; --panel: #28282f; --text: #e8e8ec; --muted: #9a9aa8;
    --line: #44444f; --accent-soft: #3f3254;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Malgun Gothic', 'Segoe UI', system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10; flex-wrap: wrap;
  }
  header h1 { font-size: 19px; margin: 0; }
  header .ver { font-size: 12px; color: var(--accent); font-weight: bold; }
  header .sub { font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }
  button, input, select {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: bold; }
  main { display: flex; gap: 16px; padding: 18px 20px 40px; align-items: flex-start; }
  #rail { display: flex; flex-direction: column; gap: 8px; width: 150px; flex: none; }
  .tab {
    border-radius: 12px; padding: 14px 10px; font-weight: bold; font-size: 13px;
    text-align: center; border-width: 2px; word-break: break-all; line-height: 1.5;
  }
  .tab.active { box-shadow: 0 0 0 3px var(--accent-soft); }
  #editor-wrap { flex: 1; min-width: 0; }
  #title-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  #title { font-size: 22px; font-weight: bold; flex: 1; }
  #toolbar {
    display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    padding: 6px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); margin-bottom: 8px;
  }
  #toolbar button { padding: 4px 9px; min-width: 34px; }
  #editor {
    min-height: 55vh; padding: 16px 18px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); outline: none; overflow-y: auto;
    line-height: 1.65;
  }
  #editor ul, #editor ol { padding-left: 24px; }
  #status { font-size: 12px; color: var(--muted); margin-top: 10px; }
  #status.error { color: #d9534f; }
  .attach { max-width: 100%; border-radius: 6px; margin-top: 10px; display: block; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog .inner { padding: 22px; width: 360px; display: flex; flex-direction: column; gap: 10px; }
  dialog h2 { margin: 0 0 4px; font-size: 18px; }
  .row { display: flex; flex-direction: column; gap: 4px; }
  .row label { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .hidden { display: none !important; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 720px) {
    main { flex-direction: column; }
    #rail { flex-direction: row; width: 100%; overflow-x: auto; }
    .tab { min-width: 110px; }
  }
</style>
</head>
<body>
<header>
  <h1>SideMemo</h1>
  <span class="ver" id="ver">웹</span>
  <span class="sub">PC 메모와 자동으로 동기화됩니다</span>
  <span class="spacer"></span>
  <span class="sub" id="account">로그인되지 않음</span>
  <button id="sync-btn">지금 동기화</button>
  <button id="theme-btn">다크 모드</button>
  <button id="login-btn" class="primary">로그인</button>
  <button id="logout-btn" class="hidden">로그아웃</button>
</header>

<main>
  <div id="rail"></div>
  <div id="editor-wrap">
    <div id="title-row">
      <input id="title" maxlength="6" placeholder="제목">
      <button id="add-btn">+ 새 메모</button>
      <button id="del-btn">삭제</button>
    </div>
    <div id="toolbar">
      <select id="font-size" title="글자 크기">
        <option>8</option><option>10</option><option>12</option><option>14</option>
        <option selected>16</option><option>18</option><option>20</option><option>24</option>
        <option>28</option><option>32</option><option>36</option><option>48</option>
      </select>
      <button data-cmd="bold" title="굵게"><b>B</b></button>
      <button data-cmd="italic" title="기울임"><i>I</i></button>
      <button data-cmd="underline" title="밑줄"><u>U</u></button>
      <button data-cmd="strikeThrough" title="취소선"><s>S</s></button>
      <button data-cmd="justifyLeft" title="왼쪽 정렬">≡</button>
      <button data-cmd="justifyCenter" title="가운데 정렬">≣</button>
      <button data-cmd="justifyRight" title="오른쪽 정렬">≢</button>
      <button data-cmd="insertUnorderedList" title="글머리 기호">•</button>
      <button data-cmd="insertOrderedList" title="번호 목록">1.</button>
      <button id="check-btn" title="체크리스트">☐</button>
    </div>
    <div id="editor" contenteditable="true"></div>
    <img id="attach" class="attach hidden" alt="첨부 이미지">
    <div id="status">로그인하면 메모가 자동으로 동기화됩니다.</div>
  </div>
</main>

<dialog id="login-dialog">
  <form class="inner" method="dialog">
    <h2 id="login-title">SideMemo 로그인</h2>
    <div class="row"><label for="email">이메일</label><input id="email" type="email" autocomplete="email"></div>
    <div class="row"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password"></div>
    <div id="login-error" class="row hidden" style="color:#d9534f;font-size:12px"></div>
    <div class="actions">
      <button type="button" id="signup-btn">회원가입</button>
      <button type="button" id="signin-btn" class="primary">로그인</button>
      <button type="button" id="close-dialog">닫기</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
